name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dotfile-build:
    name: Dotfiles
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Check Brewfile contents
        run: brew bundle list
      - name: Setup zsh
        run: brew install zsh
      - name: Check syntax of zsh scripts
        run: git ls-files -z '*.zsh' | xargs -0 zsh -n
      - name: Run combine script
        run: zsh scripts/combine_aliases.zsh
      - name: Run deploy script
        run: zsh scripts/copy_configs.zsh
